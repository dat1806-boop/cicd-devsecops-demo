name: CI-CD

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------- CI ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: flake8 app.py test_app.py --max-line-length=100
      - run: pytest -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - name: Bandit
        run: bandit -r app.py -ll
      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  # ---------- Build, scan, sign: build once, scan and push the same image ----------
  build:
    if: github.event_name != 'pull_request'
    needs: [test, secret-scan, sast, sca]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (chi build mot lan)
        run: docker build --pull --tag "$IMAGE:$GITHUB_SHA" .

      - name: Trivy scan (scan dung image se push)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Push image va lay digest
        id: push
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE:$GITHUB_SHA"
          REPO_DIGEST="$(docker image inspect "$IMAGE:$GITHUB_SHA" --format '{{range .RepoDigests}}{{println .}}{{end}}' | head -n 1)"
          DIGEST="${REPO_DIGEST##*@}"
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Khong lay duoc digest hop le tu image da push: $REPO_DIGEST" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Ky image theo digest
        run: cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"

      - name: Tao SBOM tu image theo digest
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          artifact-name: sbom.spdx.json

  # Verify signature before any environment receives the image.
  verify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    env:
      COSIGN_CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/pipeline.yml@${{ github.ref }}
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Verify Cosign signature
        run: |
          cosign verify \
            --certificate-identity "$COSIGN_CERT_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE@${{ needs.build.outputs.digest }}"

  # ---------- CD ----------
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    needs: [build, verify]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy DEV va smoke test
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run -d --name app-dev -p 3001:5000 -e APP_ENV=dev "$IMAGE@$IMAGE_DIGEST"
          for attempt in {1..20}; do
            if curl -fsS http://localhost:3001/health; then exit 0; fi
            sleep 2
          done
          docker logs app-dev || true
          docker rm -f app-dev || true
          exit 1

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: [build, verify]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy STAGING va smoke test
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run -d --name app-staging -p 3002:5000 -e APP_ENV=staging "$IMAGE@$IMAGE_DIGEST"
          for attempt in {1..20}; do
            if curl -fsS http://localhost:3002/health; then exit 0; fi
            sleep 2
          done
          docker logs app-staging || true
          docker rm -f app-staging || true
          exit 1

  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: [build, verify, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy PRODUCTION va smoke test
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run -d --name app-prod -p 3003:5000 -e APP_ENV=production "$IMAGE@$IMAGE_DIGEST"
          for attempt in {1..20}; do
            if curl -fsS http://localhost:3003/health; then exit 0; fi
            sleep 2
          done
          docker logs app-prod || true
          docker rm -f app-prod || true
          exit 1
